# BioAttend - Smart Biometric Attendance & Leave Management System Configuration

server.port=8080
server.servlet.context-path=/

# App Name & Metadata
spring.application.name=bioattend-backend

# Database Configuration (H2 In-Memory DB enabled for immediate zero-config demo execution)
# To use MySQL: Set spring.profiles.active=mysql or update jdbc settings below
spring.datasource.url=jdbc:h2:mem:bioattend_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
bioattend.app.jwtSecret=BioAttendSmartBiometricAttendanceSecretKeyForBTechLabProject2026SecureJWTKey!
bioattend.app.jwtExpirationMs=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
