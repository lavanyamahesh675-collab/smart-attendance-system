# MySQL Configuration Profile for BioAttend System
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/bioattend_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

bioattend.app.jwtSecret=BioAttendSmartBiometricAttendanceSecretKeyForBTechLabProject2026SecureJWTKey!
bioattend.app.jwtExpirationMs=86400000
